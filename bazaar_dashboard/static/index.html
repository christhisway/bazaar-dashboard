<!doctype html>
<html lang="en" data-skin="scrapbook">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazaar dashboard</title>
<!-- A skin is a stylesheet scoped to :root[data-skin="<id>"] and a script that
     registers its symbols and shapes; the page switches between them in place.
     Each stylesheet imports its own fonts: offline, the fallbacks take over. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="skins/scrapbook.css">
<link rel="stylesheet" href="skins/tycoon.css">
<link rel="stylesheet" href="skins/pixel.css">
<style>
  /* Layout and mechanics only.  Every colour, font, border and flourish belongs
     to a skin.  A rule the narrow layouts below change must also live here:
     a skin's scoped rule would outrank the media query. */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; }
  button { font: inherit; color: inherit; }
  h2, h3 { margin: 0; font-weight: 400; }
  .num { font-variant-numeric: tabular-nums; }
  .nowrap { white-space: nowrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Tones: a class sets --tone (a fill), --tone-ink (text on that fill) and
     --tone-text (the tone as text on a card); each skin decides which it reads. */
  .good { --tone: var(--good); --tone-ink: var(--good-ink); --tone-text: var(--good-text); }
  .warning { --tone: var(--warning); --tone-ink: var(--warning-ink); --tone-text: var(--warning-text); }
  .critical { --tone: var(--critical); --tone-ink: var(--critical-ink); --tone-text: var(--critical-text); }
  .neutral { --tone: var(--neutral); --tone-ink: var(--neutral-ink); --tone-text: var(--neutral-text); }
  .accent { --tone: var(--accent); --tone-ink: var(--accent-ink); --tone-text: var(--accent-text); }
  .quiet { --tone: var(--quiet); --tone-ink: var(--quiet-ink); --tone-text: var(--quiet-text); }
  /* Likewise per resource, so a mark takes its colours from the card it sits in. */
  [data-resource="water"] { --res: var(--water); --res-line: var(--water-line); --res-mark: var(--water-mark); }
  [data-resource="food"] { --res: var(--food); --res-line: var(--food-line); --res-mark: var(--food-mark); }
  [data-resource="components"] { --res: var(--components); --res-line: var(--components-line); --res-mark: var(--components-mark); }

  .badge, .btn, .chip, .live, .skin-picker { display: inline-flex; align-items: center; }
  .badge, .chip, .live { white-space: nowrap; }
  .btn, .link, .skin-picker { cursor: pointer; }
  .skin-picker .palette { flex: none; }
  .skin-picker select { appearance: none; font: inherit; cursor: pointer; }
  .link { background: none; border: 0; padding: 0; }
  .orbicon { display: inline-flex; flex: none; border-radius: 50%; border-style: solid; overflow: hidden; }
  .orbicon svg { display: block; }
  .orbicon.ocean { background: var(--water); } .orbicon.farm { background: var(--food); }
  .orbicon.forge { background: var(--components); } .orbicon.rock { background: var(--rock); }
  .dots { display: inline-flex; }
  .dot { display: inline-block; flex: none; border-radius: 50%; }
  .bundle { display: inline-flex; flex-wrap: wrap; align-items: center; }
  .chip b { font-variant-numeric: tabular-nums; }

  /* --- header ---------------------------------------------------------------------- */
  .topbar { position: sticky; top: 0; z-index: 5; }
  .bar { min-height: 72px; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
  .bar-main { display: contents; }
  .us { display: flex; align-items: center; }
  .progress { flex: 1 1 280px; min-width: 220px; display: flex; align-items: center; }
  .track { position: relative; flex: 1; }
  .track .marker { position: absolute; translate: -50% 0; }

  /* --- layout ------------------------------------------------------------------------ */
  main, footer, .waiting { position: relative; z-index: 1; }
  .layout {
    display: grid;
    grid-template-columns: clamp(270px, 22vw, 320px) minmax(0, 1fr) clamp(300px, 25vw, 356px);
    grid-template-areas: "cargo center agent";
    gap: 18px;
    padding: 16px 24px 22px;
    height: calc(100vh - var(--topbar-h, 73px));
  }
  .layout.dimmed { opacity: 0.55; transition: opacity 0.3s; }
  .cargo { grid-area: cargo; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .center { grid-area: center; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  .agent { grid-area: agent; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .waiting { text-align: center; padding: 120px 16px; }
  .waiting b { display: block; margin-bottom: 8px; }
  footer { padding: 0 24px 12px; }
  @media (max-width: 1180px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "center center" "cargo agent"; height: auto; }
    .cargo, .agent, .agent .grow { overflow: visible; }
    .map { flex: none !important; height: clamp(320px, 60vw, 600px); }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "center" "cargo" "agent"; padding: 12px 16px 18px; gap: 16px; }
    .topbar { position: static; }
    .bar { padding: 10px 16px; gap: 8px 16px; }
    .map { height: clamp(260px, 88vw, 520px); }
    .inspector { flex-direction: column; align-items: stretch; gap: 10px; }
    .inspector .who, .inspector .past { width: auto; }
    .inspector .rule { display: none; }
    .legend { justify-content: flex-start; }
  }

  /* --- verdict ------------------------------------------------------------------------- */
  .verdict { position: relative; display: flex; align-items: center; }
  .verdict .mark { flex: none; display: flex; align-items: center; justify-content: center; }
  .verdict .words { display: flex; flex-direction: column; min-width: 0; }

  /* --- the map: a fixed 720x600 stage, scaled to fit ------------------------------------- */
  .map { position: relative; flex: 1 1 auto; min-height: 300px; }
  .stage { position: absolute; left: 50%; top: 50%; width: 720px; height: 600px; transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .stage > * { position: absolute; }
  /* The skin draws into three layers: behind the lanes, between the ships and
     our planet, and in front of our planet but under the other planets. */
  .stage-layer, .lanes, .ships, .planets { left: 0; top: 0; width: 720px; height: 600px; pointer-events: none; }
  .stage-layer > * { position: absolute; }
  .stage-layer > svg { left: 0; top: 0; overflow: visible; }
  .lanes { overflow: visible; }
  .lane-trade, .lane-out, .lane-in { fill: none; }
  .planets .planet { pointer-events: auto; }
  .ship { position: absolute; left: 0; top: 0; offset-rotate: auto; animation: fly 3.5s linear 1 both; }
  .ship svg { display: block; }
  .ship.still { animation: none; offset-distance: 50%; }
  /* Labels keep a readable size when the stage shrinks. */
  .scaled-text { font-size: calc(12px / max(var(--s, 1), 0.75)); }
  /* Our planet sits at the centre of the stage; a skin sets its size. */
  .home-btn { left: 360px; top: 300px; translate: -50% -50%; padding: 0; border-style: solid; border-radius: 50%; cursor: pointer; }
  .planet { position: absolute; padding: 0; border-style: solid; border-radius: 50%; cursor: pointer; }
  .home-btn svg, .planet > svg { display: block; width: 100%; height: 100%; clip-path: circle(50%); }
  .planet .ping, .planet .sel-ring { position: absolute; border-radius: 50%; }
  .plabel { position: absolute; left: 50%; translate: -50% 0; display: flex; align-items: center; white-space: nowrap; pointer-events: none; }
  .plabel.below { top: calc(100% + 8px); }
  .plabel.above { bottom: calc(100% + 8px); }
  .plabel .cols { display: flex; flex-direction: column; }
  .plabel .pline { display: inline-flex; align-items: center; }
  .plabel.compact .rel { display: none; }

  /* --- inspector and legend ---------------------------------------------------------------- */
  .inspector { min-height: 78px; display: flex; align-items: center; gap: 14px; }
  .inspector .who { width: 188px; flex: none; display: flex; align-items: center; gap: 10px; }
  .inspector .who-text { display: flex; flex-direction: column; min-width: 0; }
  .inspector .tags { display: flex; flex-wrap: wrap; }
  .inspector .tags > span { display: inline-flex; align-items: center; }
  .inspector .rule { flex: none; }
  .inspector .now { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* Single line, always: a count going from one digit to two must not be what
     decides the bar's height.  There is room for it; ellipsis is only a
     backstop for whatever number someday does not fit. */
  .inspector .now .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inspector .terms { display: flex; flex-wrap: wrap; align-items: center; }
  /* The one dynamic count in this row: give it room to shrink and ellipsize on
     its own, rather than let its own wrapping change the bar's height. The
     terms chips beside it (a fixed "we get / we give") keep their own size. */
  .inspector .terms .note { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inspector .past { width: 128px; flex: none; display: flex; flex-direction: column; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; }
  .legend > span { display: inline-flex; align-items: center; }

  /* --- cargo hold ------------------------------------------------------------------------------ */
  .cargo-head { display: flex; justify-content: space-between; align-items: baseline; }
  .res { position: relative; flex: none; display: flex; flex-direction: column; }
  .res-head { display: flex; align-items: center; }
  .res-star { display: inline-flex; align-items: center; }
  .res-body { display: flex; flex-direction: column; }
  .amount-row { display: flex; align-items: baseline; justify-content: space-between; }
  .amount-wrap { display: flex; align-items: baseline; }
  .gauge { display: flex; flex-direction: column; }
  .gauge-head { display: flex; justify-content: space-between; align-items: baseline; }
  .gauge-bar { position: relative; overflow: hidden; }
  .gauge-bar .fill { position: absolute; inset: 0 auto 0 0; }
  .gauge-bar .notch { position: absolute; top: 0; bottom: 0; }
  .gauge-scale { position: relative; }
  .gauge-scale span { position: absolute; translate: -50% 0; }
  .gauge-scale span:first-child, .gauge-scale span:last-child { translate: none; }
  .gauge-scale span:last-child { right: 0; }
  .spark-wrap { position: relative; }
  .spark { display: block; width: 100%; overflow: visible; }
  /* Dots are HTML over the SVG so they stay round when the SVG stretches. */
  .spark-dot { position: absolute; translate: -50% -50%; border-radius: 50%; pointer-events: none; }
  .tooltip { position: absolute; z-index: 3; pointer-events: none; white-space: nowrap; }
  .minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mini { display: flex; flex-direction: column; }

  /* --- agent panel --------------------------------------------------------------------------- */
  .agent-head { display: flex; align-items: center; }
  .agent-id, .now-block { display: flex; flex-direction: column; }
  .agent section { display: flex; flex-direction: column; }
  /* Highlights give way first, so the tick strip below them always shows. */
  .agent .grow { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .goal { display: flex; align-items: center; }
  .goal .txt { display: flex; flex-direction: column; min-width: 0; }
  .goal .row1 { display: flex; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat { display: flex; flex-direction: column; }
  .event { display: flex; align-items: center; }
  .event .icon { flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .event .text { flex: 1; min-width: 0; }
  /* The script sizes the bars: up to 22px either side of the baseline. */
  .strip { position: relative; height: 48px; display: flex; gap: 4px; }
  .strip .base { position: absolute; left: 0; right: 0; top: 23px; height: 2px; }
  .strip .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .strip .up, .strip .down { height: 24px; display: flex; }
  .strip .up { align-items: flex-end; } .strip .down { align-items: flex-start; }
  .strip .up span, .strip .down span { display: block; max-width: 100%; }
  .swatch { display: inline-block; }

  /* --- the full action log ------------------------------------------------------------------- */
  dialog.log { width: min(780px, calc(100vw - 32px)); max-height: min(82vh, 900px); padding: 0; border: 0; display: none; flex-direction: column; overflow: hidden; }
  dialog.log[open] { display: flex; }
  .log-head { display: flex; align-items: center; }
  .log-head .sub { flex: 1; }
  .log-body { flex: 1; min-height: 0; overflow-y: auto; }
  .tick-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; }
  .tick-head .right { margin-left: auto; }
  .act { display: flex; align-items: flex-start; }
  .act .state { width: 88px; flex: none; }
  .act .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .act .line { display: flex; flex-wrap: wrap; align-items: center; }
  .act .score { width: 52px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .act .detail, .rid { overflow-wrap: anywhere; }
  .arrow { flex: none; }

  /* Skins animate with these; none of it runs for a reader who asked for less motion. */
  @keyframes fly { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @keyframes alarm { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes twinkle { from { opacity: 0.45; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .stage *, .stage *::before, .stage *::after { animation: none !important; }
  }
</style>
<script>
"use strict";
// Skins register here as their scripts load, before anything is drawn; the
// first one registered is the default.
const SKINS = new Map();
function registerSkin(skin) { SKINS.set(skin.id, skin); }
const SKIN_KEY = "bazaar.skin";
</script>
<script src="skins/scrapbook.js"></script>
<script src="skins/tycoon.js"></script>
<script src="skins/pixel.js"></script>
<script>
// Chosen before first paint, so a remembered skin never flashes the default.
// ?skin=<id> wins over the remembered one, so a link can name a skin.
(() => {
  let remembered = null;
  try { remembered = localStorage.getItem(SKIN_KEY); } catch (e) { /* storage blocked: use the default */ }
  const asked = new URLSearchParams(location.search).get("skin");
  const id = [asked, remembered].find((x) => x && SKINS.has(x)) || SKINS.keys().next().value;
  document.documentElement.dataset.skin = id;
})();
</script>
</head>
<body>

<header class="topbar"><div class="bar">
  <div class="bar-main" id="bar"></div>
  <label class="skin-picker" id="skin-picker" title="Dashboard skin"></label>
</div></header>
<div class="waiting" id="waiting"><b id="waiting-title">Waiting for the client</b><span id="waiting-body">Start the client as usual; this page fills in as soon as it connects.</span></div>
<main class="layout" id="main" hidden>
  <section class="cargo" id="cargo" aria-label="Cargo hold"></section>
  <section class="center" aria-label="System map">
    <div id="verdict"></div>
    <div class="map" id="map">
      <div class="stage" id="stage">
        <div class="stage-layer" id="decor-back" aria-hidden="true"></div>
        <svg class="lanes" viewBox="0 0 720 600" aria-hidden="true">
          <path id="lane-trade" class="lane-trade"></path>
          <path id="lane-out" class="lane-out"></path>
          <path id="lane-heads" class="lane-heads"></path>
          <path id="lane-in" class="lane-in"></path>
        </svg>
        <div class="ships" id="ships" aria-hidden="true"></div>
        <div class="stage-layer" id="decor-mid" aria-hidden="true"></div>
        <button type="button" class="home-btn" id="home-btn" aria-pressed="false"></button>
        <div class="stage-layer" id="decor-front"></div>
        <div class="planets" id="planets"></div>
      </div>
    </div>
    <div class="inspector card" id="inspector"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="agent card" id="agent" aria-label="Agent"></aside>
</main>
<dialog class="log" id="log" aria-labelledby="log-title">
  <div class="log-head">
    <h2 id="log-title" class="log-title">Full action log</h2>
    <span class="sub" id="log-sub"></span>
    <button type="button" class="btn" id="log-close">Close</button>
  </div>
  <div class="log-body" id="log-body"></div>
</dialog>
<footer id="footer"></footer>

<script>
"use strict";

// --- state -------------------------------------------------------------------------
let data = null;       // what is on screen
let latest = null;     // the newest view; differs from data only while paused
let paused = false;
let socketOpen = false;
let lastMessageAt = 0;
let selected = null;   // a station ID, "home", or null
let runId = null;
let seenTrades = new Set();
let firstBatch = true;
let planetKey = "";
let planetEls = new Map();
let layout = new Map();
let skin = null;       // the skin on screen, with defaults filled in
let stageDecor = null; // what that skin drew around our planet

const RESOURCES = ["water", "food", "components"];
const KIND = { water: "ocean", food: "farm", components: "forge" };
const BODY = { ocean: "water", farm: "food", forge: "components", rock: "rock" };  // a planet's colour token
const WORLD = { water: "water world", food: "farm world", components: "forge world" };
// The map is drawn on a fixed stage and scaled to fit; every coordinate below is on it.
const STAGE = { w: 720, h: 600, cx: 360, cy: 300, rx: 300, ry: 236 };
const HOME = { x: STAGE.cx, y: STAGE.cy };
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
const SVG_NS = "http://www.w3.org/2000/svg";

const STATUS = {
  queued:   { icon: "○", label: "Queued",   tone: "neutral" },
  sent:     { icon: "◐", label: "Sent",     tone: "neutral" },
  ok:       { icon: "✓", label: "Done",     tone: "good" },
  failed:   { icon: "✕", label: "Failed",   tone: "critical" },
  rejected: { icon: "!", label: "Rejected", tone: "warning" },
  error:    { icon: "!", label: "Error",    tone: "critical" },
  skipped:  { icon: "–", label: "Skipped",  tone: "neutral" },
};
const LEVEL = {
  ok:       { icon: "✓", label: "OK",       tone: "good" },
  low:      { icon: "▲", label: "Low",      tone: "warning" },
  critical: { icon: "!", label: "Critical", tone: "critical" },
};
const VERDICT_ICON = { good: "✓", warning: "!", critical: "✕", neutral: "■" };
const PHASE_TONE = { READY: "neutral", RUNNING: "good", PAUSED: "warning", FINISHED: "neutral", ABORTED: "critical" };
const EVENT_TONE = { trade: "good", info: "neutral", warning: "warning", alert: "critical", failure: "critical" };

// --- DOM helpers: every piece of data goes in as text, never as markup -------------------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  setAttrs(el, attrs);
  append(el, children);
  return el;
}
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  setAttrs(el, attrs);
  append(el, children);
  return el;
}
function setAttrs(el, attrs) {
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key === "class") el.setAttribute("class", value);
    else if (key === "style") el.style.cssText = value;
    else el.setAttribute(key, value === true ? "" : value);
  }
}
function append(el, children) {
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
}
// The one exception to the rule above: a skin's fixed decoration, written as
// markup in its own file.  Never pass it anything that came from the game.
function markup(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString();
const f1 = (n) => n.toFixed(1);
const plural = (n, word) => `${fmt(n)} ${word}${n === 1 ? "" : "s"}`;
const ticksLeft = (n) => (n <= 0 ? "this tick" : plural(n, "tick"));
// Every skin draws its own ocean, so symbols are namespaced by skin.
const sym = (name) => `#${skin.id}-${name}`;
// A short, stable wobble per station ID, so planets read as hand-placed but never jitter.
function wobble(id, spread = 9) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return ((Math.abs(hash) % (spread * 20)) / 10 - spread).toFixed(1);
}

function badge(tone, icon, label, title) {
  return h("span", { class: `badge ${tone}`, title }, icon, " ", label);
}
// A number with a span per digit, so a skin can put each on its own tile.
function digits(n) {
  const text = fmt(n);
  return h("span", { class: "digits" },
    h("span", { class: "sr-only" }, text),
    h("span", { class: "tiles", "aria-hidden": "true" }, [...text].map((c) => (/\d/.test(c) ? h("span", { class: "digit" }, c) : c))));
}
// A bordered circular sticker of a planet symbol, at any size.
function orbIcon(kind, size, extraClass) {
  const border = Math.max(2.2, size * 0.09).toFixed(1);
  const stroke = Math.max(1.1, size * 0.037).toFixed(2);
  return h("span", { class: `orbicon ${kind}${extraClass ? " " + extraClass : ""}`, style: `width:${size}px;height:${size}px;border-width:${border}px` },
    s("svg", { viewBox: "0 0 100 100", width: "100%", height: "100%" },
      s("use", { href: sym(kind), width: 100, height: 100, style: `stroke-width:${stroke}px` })));
}
function station(id) {
  const name = data && data.header.names[id];
  return name && name !== id ? `${id} · ${name}` : id;
}
function order() {
  return data ? data.reserves.map((r) => r.resource) : RESOURCES;
}
// A bundle as coloured keys with the amount beside them; "nothing" when it is all zero.
// ``sign`` prefixes each amount, so a ledger reads "−6 water +3 food".
function bundle(b, opts = {}) {
  const parts = order().filter((r) => b[r]).map((r) =>
    h("span", { class: `chip${opts.boxed ? " boxed" : ""}` },
      h("span", { class: `dot ${r}` }), h("b", {}, `${opts.sign || ""}${fmt(b[r])}`), h("span", { class: "name" }, r)));
  return parts.length ? h("span", { class: "bundle" }, parts) : h("span", { class: "muted" }, "nothing");
}
function resourceList(list) {
  if (!list.length) return h("span", { class: "muted" }, "nothing");
  return h("span", { class: "bundle" }, list.map((r) => h("span", { class: "chip" }, h("span", { class: `dot ${r}` }), r)));
}
function arrow() {
  return s("svg", { width: 16, height: 16, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 2,
                    "stroke-linecap": "round", "stroke-linejoin": "round", class: "arrow", "aria-hidden": "true" },
    s("path", { d: "M3 8h10M9 4l4 4-4 4" }));
}
// The skin's rocket, painted in a resource's colour, or its plain colour for none.
function shipIcon(resource, width = 24) {
  const [w, rh] = skin.rocket;
  return s("svg", { width, height: Math.round((width * rh) / w), viewBox: `0 0 ${w} ${rh}`, "aria-hidden": "true" },
    s("use", { href: sym("rocket"), width: w, height: rh, style: `fill:var(--${resource ? `${resource}-mark` : "ship"})` }));
}

// --- skins ---------------------------------------------------------------------------------
// A skin brings a stylesheet and its own symbols (ocean, farm, forge, rock and
// rocket, as <symbol id="<skin>-<name>">).  Anything else it leaves out falls
// back to these.  Every hook returns fresh nodes; nothing here is cached
// across a switch, so a hook never needs to clean up after itself.
const SKIN_DEFAULTS = {
  rocket: [34, 20],                                     // the rocket symbol's viewBox size
  shipName: "rocket",                                   // what the legend calls it
  geometry: { laneR: 136, planet: { far: 44, near: 52 }, ship: 26 },
  wordmark: () => h("span", { class: "wordmark" }, "Bazaar"),
  tick: (hd) => h("span", { class: "nowrap" }, `Tick ${fmt(hd.tick)} of ${fmt(hd.duration_ticks)}`),
  track: (pct) => [h("span", { class: "fill", style: `width:${pct}%` }), h("span", { class: "marker", style: `left:${pct}%` }, shipIcon(null, 30))],
  decor: (where) => null,                               // stickers for a card: "verdict" or "reserve"
  // Which symbol draws a planet: ``where`` is "home", "far" (the back half of
  // the orbit) or "near"; ``id`` lets a skin vary planets of one kind stably.
  planetSymbol: (kind, where, id) => kind,
  resourceIcon: (resource, size) => orbIcon(KIND[resource], size),   // on the cargo cards and goals
  trend: (r) => sparkline(r),                           // a reserve's recent history
  levelBadge: (level) => badge(level.tone, level.icon, level.label),
  verdictMark: (tone) => h("span", { class: "mark", "aria-hidden": "true" }, VERDICT_ICON[tone]),
  mascot: () => null,
  // Decoration round our planet, drawn once per switch; ``update`` runs on every render.
  stage: () => ({ back: [], mid: [], front: [], update: (home) => {} }),
  eventIcons: {},                                       // per highlight kind, over EVENT_ICONS
};

function skinFor(id) {
  const def = SKINS.get(id) || SKINS.values().next().value;
  return { ...SKIN_DEFAULTS, ...def, geometry: { ...SKIN_DEFAULTS.geometry, ...def.geometry } };
}

// Everything that holds one of the old skin's symbols or shapes is rebuilt;
// the data on screen stays, so switching never waits for the next state.
function applySkin(id) {
  skin = skinFor(id);
  document.documentElement.dataset.skin = skin.id;
  stageDecor = skin.stage();
  $("decor-back").replaceChildren(...stageDecor.back);
  $("decor-mid").replaceChildren(...stageDecor.mid);
  $("decor-front").replaceChildren(...stageDecor.front);
  $("ships").replaceChildren();
  planetKey = "";
  agentEls = null;
  $("skin-select").value = skin.id;
  renderLegend();
  render();
}

function chooseSkin(id) {
  applySkin(id);
  try { localStorage.setItem(SKIN_KEY, skin.id); } catch (e) { /* not remembered, still applied */ }
  const url = new URL(location.href);
  if (url.searchParams.has("skin")) {
    url.searchParams.set("skin", skin.id);
    history.replaceState(null, "", url);
  }
}

// Built once and never redrawn, so a choice is never lost to a re-render.  A
// palette in the skin's own resource colours marks what the menu is for.
function buildPicker() {
  const select = h("select", { id: "skin-select", "aria-label": "Dashboard skin" },
    [...SKINS.values()].map((def) => h("option", { value: def.id, title: def.title || def.label }, def.label)));
  select.addEventListener("change", () => chooseSkin(select.value));
  $("skin-picker").replaceChildren(
    s("svg", { class: "palette", width: 18, height: 18, viewBox: "0 0 24 24", "aria-hidden": "true" },
      s("path", { d: "M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.4-9-7.4Z",
                  fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linejoin": "round" }),
      s("circle", { cx: 7.5, cy: 11.5, r: 1.7, style: "fill:var(--water)" }),
      s("circle", { cx: 10, cy: 7, r: 1.7, style: "fill:var(--food)" }),
      s("circle", { cx: 15, cy: 7.3, r: 1.7, style: "fill:var(--components)" })),
    select);
}

// --- header ----------------------------------------------------------------------------
function renderBar() {
  const bar = $("bar");
  const hd = data && data.header;
  const logo = h("div", { class: "us logo" }, skin.wordmark());
  if (!hd) {
    bar.replaceChildren(logo, h("span", { style: "flex:1" }), h("span", { id: "paused-pill" }), h("span", { id: "conn" }));
    updateLive();
    return;
  }
  const pct = hd.duration_ticks ? Math.min(100, (100 * hd.tick) / hd.duration_ticks) : 0;
  const phase = hd.phase.charAt(0) + hd.phase.slice(1).toLowerCase();
  bar.replaceChildren(
    logo,
    h("span", { class: "divider", "aria-hidden": "true" }),
    h("div", { class: "us" },
      orbIcon(KIND[hd.specialty] || "rock", 34),
      h("span", { class: "id" }, station(hd.station)),
      h("span", { class: "muted world" }, `${WORLD[hd.specialty] || hd.specialty} · makes ${fmt(hd.specialty_made)} a tick`)),
    badge(PHASE_TONE[hd.phase] || "neutral", "●", phase),
    h("div", { class: "progress" },
      skin.tick(hd),
      h("div", { class: "track", role: "progressbar", "aria-valuenow": hd.tick, "aria-valuemax": hd.duration_ticks, "aria-label": "Run progress" },
        skin.track(pct)),
      h("span", { class: "muted nowrap next" }, "next tick ", h("b", { id: "countdown", class: "num" }, "—"))),
    h("span", { class: "verline num", title: `snapshot ${hd.snapshot_sequence}` }, `v${fmt(hd.world_version)}`),
    h("span", { id: "paused-pill" }),
    h("span", { id: "conn" }),
  );
  updateLive();
}

// Runs four times a second: the countdown and the connection indicator move between states.
function updateLive() {
  const conn = $("conn");
  const now = latest && latest.header;
  if (conn) {
    const tickMs = now ? now.tick_duration_ms : 5000;
    let tone, label, title;
    const client = latest && latest.client;
    if (!socketOpen) [tone, label] = ["critical", "Dashboard offline · retrying"];
    else if (!client) [tone, label] = ["neutral", "Waiting for client"];
    else if (!client.connected) [tone, label, title] = ["warning", "Client stopped", "showing its last state until the next client connects"];
    else if (!now) [tone, label] = ["neutral", "Client connected"];
    else if (now.phase === "RUNNING" && Date.now() - lastMessageAt > 2 * tickMs) [tone, label, title] = ["warning", "Stale", "no state for over two ticks"];
    else [tone, label] = ["good", "Live"];
    conn.replaceChildren(h("span", { class: `live ${tone}`, title }, h("span", { class: "pulse" }), label));
  }
  const pill = $("paused-pill");
  if (pill) pill.replaceChildren(paused && data && data.header
    ? badge("warning", "‖", `Paused at t${fmt(data.header.tick)}`, now && now.tick !== data.header.tick ? `the game is at t${now.tick}` : undefined)
    : "");
  const cd = $("countdown");
  if (cd && now) {
    if (now.phase !== "RUNNING" || now.tick_seen_at_ms == null) cd.textContent = "—";
    else {
      const left = now.tick_seen_at_ms + now.tick_duration_ms - Date.now();
      cd.textContent = left > 0 ? `in ~${Math.ceil(left / 1000)}s` : "due";
    }
  }
}

// --- verdict ---------------------------------------------------------------------------------
function renderVerdict() {
  const v = data.verdict;
  $("verdict").replaceChildren(h("div", { class: `verdict card ${v.tone}`, role: "status" },
    skin.decor("verdict"),
    skin.verdictMark(v.tone),
    h("div", { class: "words" },
      h("span", { class: "title" }, v.title),
      v.body ? h("span", { class: "body" }, v.body) : null)));
}

// --- the map ---------------------------------------------------------------------------------
// A lane is a gentle curve from one planet's edge to another's.  Offers bow out
// further than cargo lanes, and a lane's two directions bow to opposite sides,
// so ships going out and coming back pass each other.
function curve(a, b, ra, rb, bend) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const sx = a.x + ux * ra, sy = a.y + uy * ra, ex = b.x - ux * rb, ey = b.y - uy * rb;
  const qx = (sx + ex) / 2 - uy * bend, qy = (sy + ey) / 2 + ux * bend;
  return { d: `M${f1(sx)} ${f1(sy)} Q${f1(qx)} ${f1(qy)} ${f1(ex)} ${f1(ey)}`, qx, qy, ex, ey, len: Math.hypot(ex - sx, ey - sy) };
}
function arrowHead(c) {
  const tx = c.ex - c.qx, ty = c.ey - c.qy, len = Math.hypot(tx, ty) || 1, ux = tx / len, uy = ty / len;
  const bx = c.ex - ux * 9, by = c.ey - uy * 9;
  return `M${f1(c.ex)} ${f1(c.ey)} L${f1(bx - uy * 4.5)} ${f1(by + ux * 4.5)} L${f1(bx + uy * 4.5)} ${f1(by - ux * 4.5)} Z`;
}

// Stations sit evenly round one orbit, offset so none hides straight above or
// below us.  The far half is drawn a little smaller; a crowded orbit shrinks.
function stationLayout(stations) {
  const n = stations.length;
  const size = skin.geometry.planet;
  const shrink = Math.min(1, Math.max(0.6, 8 / Math.max(n, 1)));
  const out = new Map();
  stations.forEach((st, k) => {
    const a = ((-90 + 180 / n + (360 * k) / n) * Math.PI) / 180;
    const far = Math.sin(a) < 0;
    const dia = Math.round((far ? size.far : size.near) * shrink);
    out.set(st.station, { x: STAGE.cx + STAGE.rx * Math.cos(a), y: STAGE.cy + STAGE.ry * Math.sin(a), r: dia / 2, dia, far, above: Math.sin(a) < -0.5 });
  });
  return out;
}

function buildPlanets(stations) {
  layout = stationLayout(stations);
  planetEls = new Map();
  const compact = stations.length > 12;
  const nodes = stations.map((st) => {
    const p = layout.get(st.station);
    const use = s("use", { href: sym(skin.planetSymbol("rock", p.far ? "far" : "near", st.station)), width: 100, height: 100 });
    const els = {
      ping: h("span", { class: "ping", hidden: true }),
      ring: h("span", { class: "sel-ring", hidden: true }),
      use,
      dots: h("span", { class: "dots" }),
      rel: h("span", { class: "rel quiet" }),
    };
    els.label = h("span", { class: `plabel card scaled-text ${p.above ? "above" : "below"}${compact ? " compact" : ""}` },
      h("span", { class: "bullet", "aria-hidden": "true" }),
      h("span", { class: "cols" },
        h("span", { class: "pline" }, els.dots, h("b", { class: "pid" }, st.station)), els.rel));
    els.btn = h("button", { type: "button", class: "planet", "aria-pressed": "false",
                            style: `left:${f1(p.x - p.r)}px; top:${f1(p.y - p.r)}px; width:${p.dia}px; height:${p.dia}px; background:var(--rock); --wobble:${wobble(st.station)}deg` },
      s("svg", { viewBox: "0 0 100 100" }, use),
      els.ping, els.ring, els.label);
    els.btn.addEventListener("click", () => select(st.station));
    planetEls.set(st.station, els);
    return els.btn;
  });
  $("planets").replaceChildren(...nodes);
}

// What the label under a planet says: the most pressing thing between it and us.
function relation(st) {
  if (st.incoming.length) {
    const o = st.incoming[0];
    return { text: `offer for us · ${ticksLeft(o.ticks_left)}`, tone: o.ticks_left <= 1 ? "warning" : "accent" };
  }
  if (st.cargo) return { text: `cargo · t${st.last_trade.settled_tick}`, tone: "good" };
  if (st.outgoing.length > 1) return { text: `${st.outgoing.length} offers from us`, tone: "neutral" };
  if (st.outgoing.length) return { text: `our offer · ${ticksLeft(st.outgoing[0].ticks_left)}`, tone: "neutral" };
  if (st.sells.length) return { text: `sells ${st.sells.join(" & ")}`, tone: "quiet" };
  if (st.seeks.length) return { text: `wants ${st.seeks.join(" & ")}`, tone: "quiet" };
  return { text: "no listing", tone: "quiet" };
}

function renderMap() {
  const stations = data.stations;
  const key = stations.map((st) => st.station).join(",");
  if (key !== planetKey) {
    planetKey = key;
    buildPlanets(stations);
  }
  const laneR = skin.geometry.laneR;
  let out = "", inc = "", trade = "", heads = "";
  for (const st of stations) {
    const p = layout.get(st.station);
    const els = planetEls.get(st.station);
    if (!p || !els) continue;
    if (st.outgoing.length) {
      const c = curve(HOME, p, laneR, p.r + 10, 34);
      out += `${c.d} `;
      heads += `${arrowHead(c)} `;
    }
    if (st.incoming.length) inc += `${curve(p, HOME, p.r + 10, laneR, 34).d} `;
    if (st.cargo) trade += `${curve(HOME, p, laneR, p.r + 6, 14).d} ${curve(p, HOME, p.r + 6, laneR, 14).d} `;

    const rel = relation(st);
    const kind = st.sells.length ? KIND[st.sells[0]] || "rock" : "rock";
    els.btn.style.background = `var(--${BODY[kind]})`;
    const href = sym(skin.planetSymbol(kind, p.far ? "far" : "near", st.station));
    if (els.use.getAttribute("href") !== href) els.use.setAttribute("href", href);
    if (els.dots.dataset.sells !== st.sells.join()) {
      els.dots.dataset.sells = st.sells.join();
      els.dots.replaceChildren(...st.sells.map((r) => h("span", { class: `dot ${r}` })));
    }
    els.rel.textContent = rel.text;
    els.rel.className = `rel ${rel.tone}`;
    els.label.dataset.tone = rel.tone;
    els.ping.hidden = !st.incoming.length;
    els.ring.hidden = selected !== st.station;
    els.btn.setAttribute("aria-pressed", selected === st.station ? "true" : "false");
    const sells = st.sells.length && !rel.text.startsWith("sells") ? `, sells ${st.sells.join(" and ")}` : "";
    els.btn.setAttribute("aria-label", `${station(st.station)}: ${rel.text}${sells}`);
  }
  $("lane-out").setAttribute("d", out);
  $("lane-heads").setAttribute("d", heads);
  $("lane-in").setAttribute("d", inc);
  $("lane-trade").setAttribute("d", trade);
  renderHome();
  launchShips();
}

function renderHome() {
  const hd = data.header, hl = data.health;
  const pct = hl.max_health ? Math.max(0, hl.health) / hl.max_health : 0;
  const tone = pct >= 0.6 ? "good" : pct >= 0.3 ? "warning" : "critical";
  const kind = KIND[hd.specialty] || "ocean";
  const btn = $("home-btn");
  btn.replaceChildren(s("svg", { viewBox: "0 0 100 100" }, s("use", { href: sym(skin.planetSymbol(kind, "home", hd.station)), width: 100, height: 100 })));
  btn.style.background = `var(--${BODY[kind]})`;
  btn.setAttribute("aria-pressed", selected === "home" ? "true" : "false");
  btn.setAttribute("aria-label", `${hd.station}, our station: health ${hl.health} of ${hl.max_health}`);
  stageDecor.update({ hd, hl, pct, tone, kind, alarm: pct < 0.3 && hd.phase === "RUNNING", selected: selected === "home" });
}

// A ship per resource leaves each way when a trade settles: what we paid flies
// out, what we got flies home, and the two pass mid-lane.  On first load only
// trades still "in flight" get ships; the rest are history.
function launchShips() {
  const hd = data.header;
  const laneR = skin.geometry.laneR;
  const fresh = [];
  for (const t of data.trades.recent) {
    if (seenTrades.has(t.transaction_id)) continue;
    seenTrades.add(t.transaction_id);
    if (!firstBatch || hd.tick - t.settled_tick < data.map.cargo_ticks) fresh.push(t);
  }
  firstBatch = false;
  for (const t of fresh.reverse()) {
    const p = layout.get(t.counterparty);
    if (!p) continue;
    const out = curve(HOME, p, laneR, p.r + 6, 14), back = curve(p, HOME, p.r + 6, laneR, 14);
    RESOURCES.filter((r) => t.we_gave[r]).forEach((r, i) => ship(out, r, i * 0.35));
    RESOURCES.filter((r) => t.we_got[r]).forEach((r, i) => ship(back, r, i * 0.35));
  }
}

function ship(c, resource, delay) {
  const layer = $("ships");
  if (layer.childElementCount >= 40) return;  // a flood of trades still reads as traffic
  const dur = Math.min(4.5, Math.max(2.8, c.len / 36));
  const el = h("div", { class: "ship", style: `offset-path: path('${c.d}'); animation-duration: ${dur.toFixed(2)}s; animation-delay: ${delay}s` },
    shipIcon(resource, skin.geometry.ship));
  if (REDUCED.matches) {
    el.classList.add("still");
    setTimeout(() => el.remove(), 3000);
  } else {
    el.addEventListener("animationend", () => el.remove());
  }
  layer.append(el);
}

function select(id) {
  selected = selected === id ? null : id;
  if (!data) return;
  renderMap();
  renderInspector();
}

function renderLegend() {
  const key = (cls, x1, x2) => s("svg", { width: 26, height: 8, viewBox: "0 0 26 8", "aria-hidden": "true" }, s("line", { class: cls, x1, y1: 4, x2, y2: 4 }));
  $("legend").replaceChildren(
    h("span", {}, key("key-out", 1, 25), "our offer"),
    h("span", {}, key("key-in", 2, 24), "offer for us"),
    h("span", {}, h("span", { class: "key-ship" }, shipIcon("food", 24)), `${skin.shipName} = trade just settled`),
    h("span", {}, h("span", { class: "key-orbs", "aria-hidden": "true" }, ["ocean", "farm", "forge"].map((k) => orbIcon(k, 14))),
      "colour = what a planet sells"));
}

// --- inspector: the selected planet, or the system at a glance ----------------------------------
function tagLine(label, list) {
  return list.length ? h("span", {}, label, " ", list.map((r) => h("span", { class: `dot ${r}` })),
    h("b", {}, list.map((r, i) => [i ? " & " : "", h("span", { class: `word ${r}` }, r)]))) : null;
}
function terms(get, give) {
  return [
    h("span", { class: "chip" }, h("span", { class: "muted" }, "we get"), bundle(get, { sign: "+" })),
    h("span", { class: "chip" }, h("span", { class: "muted" }, "we give"), bundle(give, { sign: "−" })),
  ];
}
function inspectorParts(orbKind, caption, name, tags, title, tone, termsNodes, note, pastValue, pastNote) {
  return [
    h("div", { class: "who" },
      orbIcon(orbKind, 42),
      h("div", { class: "who-text" },
        h("span", { class: "caption dark who-k" }, caption),
        h("span", { class: "who-name" }, name),
        h("div", { class: "tags" }, tags))),
    h("span", { class: "rule", "aria-hidden": "true" }),
    h("div", { class: `now ${tone}` },
      h("span", { class: "t" }, title),
      h("div", { class: "terms" }, termsNodes, note ? h("span", { class: "note" }, note) : null)),
    h("span", { class: "rule", "aria-hidden": "true" }),
    h("div", { class: "past" }, h("span", { class: "v" }, pastValue), h("span", { class: "k" }, pastNote)),
  ];
}

function renderInspector() {
  const box = $("inspector");
  const hd = data.header;
  if (selected === "home") {
    const hl = data.health;
    const pct = hl.max_health ? hl.health / hl.max_health : 0;
    const tone = pct >= 0.6 ? "good" : pct >= 0.3 ? "warning" : "critical";
    const word = { good: "healthy", warning: "hurting", critical: "in danger" }[tone];
    box.replaceChildren(...inspectorParts(
      KIND[hd.specialty] || "ocean", "OUR STATION", `${hd.station} · us`,
      tagLine("makes", [hd.specialty]),
      `Health ${fmt(hl.health)} / ${fmt(hl.max_health)} · ${word}`, tone, [],
      `short streak ${plural(hl.current_shortage_streak, "tick")} · longest ${fmt(hl.longest_shortage_streak)}` +
        (hl.failed_once ? ` · failed at t${hl.first_failure_tick}` : ""),
      plural(hl.fully_supplied_ticks, "tick"), `fully supplied · ${fmt(hl.shortage_ticks)} short`));
    return;
  }
  const st = selected && data.stations.find((x) => x.station === selected);
  if (!st) {
    const incoming = data.offers.incoming.length, outgoing = data.offers.outgoing.length;
    box.replaceChildren(...inspectorParts(
      KIND[hd.specialty] || "ocean", "SYSTEM", plural(data.stations.length, "station"),
      [h("span", {}, "click a planet for details")],
      `${plural(incoming, "offer")} for us · ${fmt(outgoing)} of ours out`, incoming ? "accent" : "neutral", [],
      `${plural(data.recent.trades, "trade")} in the last ${data.recent.to_tick - data.recent.from_tick + 1} ticks`,
      plural(data.trades.total, "trade"), "with us this run"));
    return;
  }
  let title = "Nothing open with us", tone = "neutral", termNodes = [], note = "";
  if (st.incoming.length) {
    const o = st.incoming[0];
    [title, tone, termNodes] = ["Offer waiting on us", o.ticks_left <= 1 ? "warning" : "accent", terms(o.we_get, o.we_give)];
    note = `${ticksLeft(o.ticks_left)} left` + (st.incoming.length > 1 ? ` · ${st.incoming.length - 1} more` : "");
  } else if (st.cargo) {
    const t = st.last_trade;
    [title, tone, termNodes] = ["Cargo in flight", "good", terms(t.we_got, t.we_gave)];
    note = `settled t${t.settled_tick}` + (st.outgoing.length ? " · another offer out" : "");
  } else if (st.outgoing.length) {
    const o = st.outgoing[0];
    [title, tone, termNodes] = [st.outgoing.length > 1 ? `Our ${st.outgoing.length} offers to them` : "Our offer to them", "neutral", terms(o.we_get, o.we_give)];
    note = `${ticksLeft(o.ticks_left)} left`;
  }
  const tags = [tagLine("sells", st.sells), tagLine("wants", st.seeks)].filter(Boolean);
  box.replaceChildren(...inspectorParts(
    st.sells.length ? KIND[st.sells[0]] || "rock" : "rock", "SELECTED PLANET", station(st.station),
    tags.length ? tags : [h("span", {}, "no listing on the board")],
    title, tone, termNodes, note,
    plural(st.trades_total, "trade"), st.last_trade ? `with us · last t${st.last_trade.settled_tick}` : "with us this run"));
}

// --- cargo hold ----------------------------------------------------------------------------------
function reserveCard(r) {
  const level = LEVEL[r.level];
  const scale = data.cover_scale;
  const at = (ticks) => `${(100 * ticks) / scale.max_ticks}%`;
  const fill = r.self_sufficient || r.cover_ticks == null ? 100
    : Math.max(r.cover_ticks > 0 ? 2 : 0, Math.min(1, r.cover_ticks / scale.max_ticks) * 100);
  const net = r.net_per_tick;
  const cover = r.self_sufficient ? "makes its own" : r.cover_ticks == null ? "not consumed"
    : r.cover_ticks === 0 ? "empty" : `${r.cover_ticks} ticks`;
  return h("article", { class: "res card", "data-resource": r.resource },
    skin.decor("reserve"),
    h("div", { class: "res-head" },
      skin.resourceIcon(r.resource, 30),
      h("span", { class: "res-name" }, r.resource),
      r.is_specialty ? h("span", { class: "res-star", title: "our specialty: we produce it" }, "we make it") : null,
      skin.levelBadge(level)),
    h("div", { class: "res-body" },
      h("div", { class: "amount-row" },
        h("span", { class: "amount-wrap" },
          h("span", { class: "amount" }, digits(r.amount)), h("span", { class: "amount-note" }, "in the hold")),
        h("span", { class: "net num", title: "made minus burned last tick, before any trades" },
          `${net > 0 ? "+" : net < 0 ? "−" : "±"}${fmt(Math.abs(net))} / tick`)),
      h("div", { class: `gauge ${level.tone}` },
        h("div", { class: "gauge-head" }, h("span", { class: "gauge-k" }, "Lasts"), h("span", { class: "toned num" }, cover)),
        h("div", { class: "gauge-bar", role: "meter", "aria-label": `${r.resource} cover in ticks`,
                   "aria-valuenow": r.cover_ticks ?? scale.max_ticks, "aria-valuemax": scale.max_ticks },
          h("span", { class: "fill", style: `width:${fill}%` }),
          h("span", { class: "notch", style: `left:${at(scale.critical_ticks)}` }),
          h("span", { class: "notch", style: `left:${at(scale.low_ticks)}` })),
        h("div", { class: "gauge-scale", "aria-hidden": "true" },
          h("span", { style: "left:0" }, "0"),
          h("span", { style: `left:${at(scale.critical_ticks)}` }, fmt(scale.critical_ticks)),
          h("span", { style: `left:${at(scale.low_ticks)}` }, fmt(scale.low_ticks)),
          h("span", {}, `${fmt(scale.max_ticks)}+ ticks`))),
      skin.trend(r),
      h("div", { class: "minis" },
        [["MAKES", r.last_production], ["BURNS", r.upkeep], ["BOUGHT", r.imported_total], ["SOLD", r.exported_total]].map(([k, v]) =>
          h("div", { class: "mini" }, h("span", { class: "k" }, k), h("span", { class: "v" }, fmt(v))))),
      r.last_unmet ? h("div", { class: "alert critical" }, `! ${fmt(r.last_unmet)} short last tick, costing health`) : null));
}

// A single-series trend: a line, a faint wash, an end dot, and a crosshair that
// snaps to the nearest tick on hover.  Colours come from the card's resource.
function sparkline(r) {
  const pts = r.history;
  if (pts.length < 2) return h("div", { class: "spark-empty" }, "trend appears after two ticks");
  const W = 280, H = 26, pad = 3;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const maxY = Math.max(1, ...pts.map((p) => p[1]));
  const x = (t) => pad + ((W - 2 * pad) * (t - t0)) / Math.max(1, t1 - t0);
  const y = (v) => H - pad - ((H - 2 * pad) * v) / maxY;  // zero is the baseline: empty means empty
  const line = pts.map((p, i) => `${i ? "L" : "M"}${f1(x(p[0]))},${f1(y(p[1]))}`).join("");
  const svg = s("svg", { class: "spark", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img",
                          "aria-label": `${r.resource} over the last ${pts.length} ticks` },
    s("path", { class: "spark-fill", d: `${line}L${f1(x(t1))},${y(0)}L${f1(x(t0))},${y(0)}Z` }),
    s("path", { class: "spark-line", d: line, fill: "none", "vector-effect": "non-scaling-stroke" }));
  const cross = s("line", { class: "spark-cross", y1: pad, y2: H - pad, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  svg.append(cross);
  const wrap = h("div", { class: "spark-wrap" }, svg);
  const place = (el, px, py) => { el.style.left = `${(100 * px) / W}%`; el.style.top = `${(100 * py) / H}%`; };
  const last = pts[pts.length - 1];
  const end = h("span", { class: "spark-dot" });
  place(end, x(last[0]), y(last[1]));
  const hover = h("span", { class: "spark-dot", style: "visibility:hidden" });
  const tip = h("div", { class: "tooltip", style: "visibility:hidden" });
  wrap.append(end, hover, tip);
  svg.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    let best = pts[0];
    for (const p of pts) if (Math.abs(x(p[0]) - px) < Math.abs(x(best[0]) - px)) best = p;
    const bx = x(best[0]);
    cross.setAttribute("x1", bx); cross.setAttribute("x2", bx);
    cross.setAttribute("visibility", "visible");
    place(hover, bx, y(best[1]));
    hover.style.visibility = "visible";
    tip.replaceChildren(h("b", {}, fmt(best[1])), ` ${r.resource} · tick ${best[0]}`);
    tip.style.left = `${Math.min(Math.max(0, (bx / W) * box.width - 60), box.width - 140)}px`;
    tip.style.top = "-26px";
    tip.style.visibility = "visible";
  });
  svg.addEventListener("pointerleave", () => {
    cross.setAttribute("visibility", "hidden");
    hover.style.visibility = "hidden";
    tip.style.visibility = "hidden";
  });
  return wrap;
}

// A panel under the pointer waits for it to leave before redrawing: redrawing
// would drop a sparkline tooltip, or move the log while it is being read.
const hovered = { cargo: false, log: false };
const stale = { cargo: false, log: false };
function holdWhileHovered(id, key, redraw) {
  const el = $(id);
  el.addEventListener("pointerenter", () => { hovered[key] = true; });
  el.addEventListener("pointerleave", () => {
    hovered[key] = false;
    if (stale[key] && data && data.header) { stale[key] = false; redraw(); }
  });
}

function renderCargo() {
  $("cargo").replaceChildren(
    h("div", { class: "cargo-head" }, h("span", { class: "title" }, "Cargo hold"), h("span", { class: "sub" }, "how long each lasts")),
    ...data.reserves.map(reserveCard));
}

// --- agent panel: intent and counts, which change slowly enough to read -------------------------------
const EVENT_ICONS = {
  trade: () => shipIcon(null, 18),
  warning: () => s("svg", { width: 15, height: 15, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linejoin": "round", "stroke-linecap": "round", "aria-hidden": "true" },
    s("path", { d: "M8 2 L14.5 13.5 L1.5 13.5 Z" }), s("path", { d: "M8 6.5 L8 9.4 M8 11.6 L8 11.7" })),
  failure: () => s("svg", { width: 15, height: 15, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "aria-hidden": "true" },
    s("path", { d: "M4.5 4.5 L11.5 11.5 M11.5 4.5 L4.5 11.5" })),
  info: () => s("svg", { width: 15, height: 15, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" },
    s("path", { d: "M2.5 5.5 H12.5 L10 3" }), s("path", { d: "M13.5 10.5 H3.5 L6 13" })),
};
EVENT_ICONS.alert = EVENT_ICONS.warning;
const eventIcon = (kind) => (skin.eventIcons[kind] || EVENT_ICONS[kind] || EVENT_ICONS.info)();

// The panel's frame is built once per skin, so its buttons are never swapped
// out from under a click; each update only fills in the parts that change.
let agentEls = null;

function buildAgent() {
  const column = (gap) => h("div", { style: `display:flex; flex-direction:column; gap:${gap}px` });
  const els = {
    name: h("span", { class: "agent-name" }),
    pause: h("button", { type: "button", class: "btn" }),
    now: h("span", { class: "caption dark" }),
    headline: h("span", { class: "headline" }),
    goals: column(8),
    window: h("span", { class: "caption dark" }),
    range: h("span", { class: "num range" }),
    stats: h("div", { class: "stats" }),
    problem: h("div", { class: "problem" }),
    events: column(9),
    stripLabel: h("span", { class: "caption dark" }),
    strip: h("div", { class: "strip", role: "img" }),
    from: h("span", {}),
    to: h("span", {}),
    pausedShown: null,
  };
  els.pause.addEventListener("click", togglePause);
  const logButton = h("button", { type: "button", class: "link" }, "Full action log →");
  logButton.addEventListener("click", openLog);
  $("agent").replaceChildren(
    h("div", { class: "agent-head" },
      skin.mascot(),
      h("div", { class: "agent-id" }, h("span", { class: "caption dark" }, "Agent"), els.name),
      els.pause),
    h("section", {},
      h("div", { class: "now-block" }, els.now, els.headline),
      els.goals),
    h("section", {}, h("div", { class: "row-between" }, els.window, els.range), els.stats, els.problem),
    h("section", { class: "grow" },
      h("div", { class: "row-between" }, h("span", { class: "caption dark" }, "Highlights"), logButton),
      els.events),
    h("section", {},
      h("div", { class: "row-between" }, els.stripLabel,
        h("span", { class: "strip-key" }, h("span", { class: "swatch up" }), "trades ↑  ", h("span", { class: "swatch down" }), "failures ↓")),
      els.strip,
      h("div", { class: "row-between num strip-ends" }, els.from, els.to)));
  return els;
}

function goalRow(g) {
  const buyish = g.verb === "buy";
  return h("div", { class: `goal${buyish ? " buy" : ""}` },
    skin.resourceIcon(g.resource, 28),
    h("div", { class: "txt" },
      h("div", { class: "row1" },
        h("span", { class: `verb${buyish ? " buy" : ""}` }, g.verb.toUpperCase()),
        h("span", { class: "res-word" }, g.resource.charAt(0).toUpperCase() + g.resource.slice(1))),
      h("span", { class: "text" }, g.text)));
}

function stat(tone, value, label) {
  return h("div", { class: `stat ${tone}` }, h("span", { class: "v" }, fmt(value)), h("span", { class: "k" }, label));
}

function renderAgent() {
  const els = agentEls || (agentEls = buildAgent());
  const hd = data.header, plan = data.plan, rc = data.recent;
  if (els.pausedShown !== paused) {
    // Only when it changes: a button whose insides are swapped mid-press can lose the click.
    els.pausedShown = paused;
    els.pause.setAttribute("aria-pressed", paused ? "true" : "false");
    els.pause.replaceChildren(
      paused
        ? s("svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" }, s("path", { d: "M3 1.8 L10.2 6 L3 10.2 Z", fill: "currentColor" }))
        : s("svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" },
            s("rect", { x: 2, y: 1.5, width: 2.8, height: 9, rx: 0.8, fill: "currentColor" }),
            s("rect", { x: 7.2, y: 1.5, width: 2.8, height: 9, rx: 0.8, fill: "currentColor" })),
      paused ? "Resume" : "Pause");
  }
  els.name.textContent = hd.agent ? hd.agent.charAt(0).toUpperCase() + hd.agent.slice(1) : "—";
  els.now.textContent = paused ? `Paused at t${fmt(hd.tick)}` : "Right now";
  els.now.className = `caption dark${paused ? " toned warning" : ""}`;
  els.headline.textContent = plan.headline;
  els.goals.replaceChildren(...plan.goals.map(goalRow));

  els.window.textContent = `Last ${rc.to_tick - rc.from_tick + 1} ticks`;
  els.range.textContent = `t${rc.from_tick}–t${rc.to_tick}`;
  els.stats.replaceChildren(
    stat("good", rc.trades, "trades done"),
    stat("neutral", rc.expired, "offers expired"),
    stat(rc.failures ? "critical" : "neutral", rc.failures, "failures"));
  const top = rc.top_failure;
  if (top) {
    els.problem.className = `problem ${top.count >= rc.failures / 2 && rc.failures >= 5 ? "critical" : "neutral"}`;
    els.problem.textContent = `Most failures: ${top.reason} (${fmt(top.count)} of ${fmt(rc.failures)})` + (top.hint ? `: ${top.hint}.` : ".");
  } else {
    els.problem.className = "problem good";
    els.problem.textContent = "No failed commands.";
  }

  els.events.replaceChildren(...(data.highlights.length
    ? data.highlights.map((e) => h("div", { class: `event ${EVENT_TONE[e.kind] || "neutral"}` },
        h("span", { class: "icon" }, eventIcon(e.kind)),
        h("span", { class: "text" }, e.text),
        h("span", { class: "t" }, `t${e.tick}`)))
    : [h("span", { class: "empty" }, "Nothing notable yet.")]));

  const maxEvents = Math.max(3, ...rc.strip.map((t) => Math.max(t.trades, t.failures)));
  const bar = (n) => (n ? h("span", { style: `height:${Math.round((22 * n) / maxEvents)}px` }) : null);
  els.stripLabel.textContent = `Last ${rc.strip.length} ticks`;
  els.strip.setAttribute("aria-label", `Trades and failures over the last ${rc.strip.length} ticks`);
  els.strip.replaceChildren(h("span", { class: "base" }),
    ...rc.strip.map((t) => h("div", { class: "col", title: `t${t.tick}: ${plural(t.trades, "trade")}, ${plural(t.failures, "failure")}` },
      h("div", { class: "up" }, bar(t.trades)),
      h("div", { class: "down" }, bar(t.failures)))));
  els.from.textContent = `t${rc.strip.length ? rc.strip[0].tick : rc.to_tick}`;
  els.to.textContent = `t${rc.to_tick}`;
}

function togglePause() {
  paused = !paused;
  if (!paused && latest && latest !== data) {
    data = latest;
    render();
  } else if (data && data.header) {
    renderAgent();
  }
  updateLive();
}

// --- the full action log ---------------------------------------------------------------------------
function giveGet(give, get) {
  return [h("span", { class: "soft" }, "give"), bundle(give, { boxed: true }), arrow(),
          h("span", { class: "soft" }, "get"), bundle(get, { boxed: true })];
}
function actionLine(a) {
  const t = a.terms || {};
  const kind = (k) => h("span", { class: "kind" }, k);
  switch (t.kind) {
    case "offer":
      return [kind("Offer"), h("span", { class: "who" }, `to ${station(t.counterparty)}`), giveGet(t.we_give, t.we_get),
              h("span", { class: "until" }, `until t${t.expires_tick}`)];
    case "accept":
      return [kind("Accept"), t.counterparty ? h("span", { class: "who" }, `from ${station(t.counterparty)}`) : null,
              t.we_give ? giveGet(t.we_give, t.we_get) : h("span", { class: "rid" }, t.offer_id)];
    case "advertise":
      return [kind("Advertise"), h("span", { class: "soft" }, "selling"), resourceList(t.selling),
              h("span", { class: "soft" }, "· seeking"), resourceList(t.seeking)];
    case "withdraw":
      return [kind("Withdraw"), t.counterparty ? h("span", { class: "who" }, `offer to ${station(t.counterparty)}`) : null,
              h("span", { class: "rid" }, t.object_id)];
    default:
      return [kind(t.kind || "Action"), h("span", {}, a.description)];
  }
}
function renderLog() {
  const ac = data.actions;
  const rows = [];
  let group = null;
  for (const a of ac.recent) {
    if (a.world_version !== group) {
      group = a.world_version;
      const n = ac.recent.filter((x) => x.world_version === group).length;
      rows.push(h("div", { class: "tick-head" },
        h("span", { class: "tick-title" }, `Tick ${fmt(a.tick)}`),
        h("span", { class: "num tick-v" }, `v${fmt(a.world_version)}`),
        h("span", { class: "right" }, plural(n, "action"))));
    }
    const st = STATUS[a.status] || { icon: "?", label: a.status, tone: "neutral" };
    const detail = a.status === "ok" || !a.detail ? null : a.status === "failed" ? a.detail.replace(/_/g, " ").toLowerCase() : a.detail;
    rows.push(h("div", { class: "act" },
      h("div", { class: "state" }, badge(st.tone, st.icon, st.label)),
      h("div", { class: "what" },
        h("div", { class: "line" }, actionLine(a)),
        a.reason ? h("span", { class: "why" }, a.reason) : null,
        detail ? h("span", { class: `detail ${st.tone}` }, detail) : null,
        a.request_id ? h("span", { class: "rid" }, a.request_id) : null),
      h("span", { class: "score", title: a.score == null ? "the client did not report a score" : "score" }, a.score == null ? "" : a.score.toFixed(2))));
  }
  const ld = ac.last_decision;
  $("log-sub").textContent = `${ld ? `last decision t${ld.tick}` : "no decisions reported"} · ${fmt(ac.results_used)} / ${fmt(ac.results_cap)} result slots used`;
  $("log-body").replaceChildren(...(rows.length ? rows : [h("div", { class: "empty log-empty" },
    "No commands yet. Commands appear here as the client sends them; reasons and scores appear only if the client reports them.")]));
}
function openLog() {
  renderLog();
  $("log").showModal();
}
$("log-close").addEventListener("click", () => $("log").close());

// --- page -----------------------------------------------------------------------------------------
function render() {
  renderBar();
  const ready = data && data.header;
  $("waiting").hidden = !!ready;
  $("main").hidden = !ready;
  const client = data && data.client;
  $("waiting-title").textContent = client && client.connected ? "Client connected" : "Waiting for the client";
  $("waiting-body").textContent = client && client.connected
    ? "Waiting for the game's first state."
    : "Start the client as usual; this page fills in as soon as it connects.";
  const dash = data && data.dashboard;
  $("footer").replaceChildren(dash && dash.errors
    ? `dashboard: ${dash.errors} internal error${dash.errors === 1 ? "" : "s"} (trading unaffected) · last: ${dash.last_error}`
    : "");
  if (!ready) return;

  const hd = data.header;
  if (hd.run_id !== runId) {
    // A new run: its trades are new, and the old selection may not exist.
    runId = hd.run_id;
    seenTrades = new Set();
    firstBatch = true;
    $("ships").replaceChildren();
  }
  if (selected && selected !== "home" && !data.stations.some((st) => st.station === selected)) selected = null;
  document.title = `${hd.station} · t${hd.tick}/${hd.duration_ticks} · Bazaar`;
  renderVerdict();
  if (hovered.cargo) stale.cargo = true; else renderCargo();
  renderMap();
  renderInspector();
  renderAgent();
  if ($("log").open) { if (hovered.log) stale.log = true; else renderLog(); }
}

$("home-btn").addEventListener("click", () => select("home"));
holdWhileHovered("cargo", "cargo", renderCargo);
holdWhileHovered("log-body", "log", renderLog);

// The stage keeps its own 720x600 coordinates; only its scale follows the window.
const mapBox = $("map"), stage = $("stage");
new ResizeObserver(() => {
  const scale = Math.min(mapBox.clientWidth / STAGE.w, mapBox.clientHeight / STAGE.h);
  stage.style.setProperty("--s", Math.max(0.3, scale || 1).toFixed(3));
}).observe(mapBox);

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/ws`);
  ws.onopen = () => { socketOpen = true; $("main").classList.remove("dimmed"); updateLive(); };
  ws.onmessage = (event) => {
    latest = JSON.parse(event.data);
    lastMessageAt = Date.now();
    if (!paused || !data || !data.header) {
      data = latest;
      render();
    } else {
      updateLive();
    }
  };
  ws.onclose = () => {
    // Keep the last picture, dimmed: after a run ends it is the thing worth reading.
    socketOpen = false;
    $("main").classList.add("dimmed");
    updateLive();
    setTimeout(connect, 2000);
  };
}

// Every skin's symbols are in the page at once, each namespaced by its skin.
for (const def of SKINS.values()) {
  document.body.insertAdjacentHTML("afterbegin",
    `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${def.symbols}</defs></svg>`);
}
buildPicker();
applySkin(document.documentElement.dataset.skin);
connect();
setInterval(updateLive, 250);
</script>
